name: Smoke test

# Proves in a pull request that changes the jobs of Claude that they still run: the
# egress-firewall runner and its hosts, the Claude Code action, the token and the
# schema of an answer. It asks Claude for one word, a tiny part of the weekly limit,
# and sends the answer to nobody. By hand from the Actions tab as well.

on:
  pull_request:
    paths:
      - .github/egress-firewall.yaml
      - .github/workflows/ask.yml
      - .github/workflows/pager.yml
      - .github/workflows/smoke.yml
      - pager/**
  workflow_dispatch:

permissions: {}

concurrency:
  group: smoke-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare the smoke test
    # Dependabot's pull requests get no secrets, so Claude can't run there, and
    # neither does the template, which holds no token of Claude: each control
    # repository runs this test on the pull request that brings a change of it.
    if: github.actor != 'dependabot[bot]' && github.repository != 'Dennis-Otto/repo-pager-control-template'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tools: ${{ steps.prepare.outputs.tools }}
      turns: ${{ steps.prepare.outputs.turns }}
      budget: ${{ steps.prepare.outputs.budget }}
      model: ${{ steps.prepare.outputs.model }}
      effort: ${{ steps.prepare.outputs.effort }}
      schema: ${{ steps.prepare.outputs.schema }}
      prompt: ${{ steps.prepare.outputs.prompt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Prepare a free text
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          PAGER_EVENT_NAME: workflow_dispatch
          PAGER_EVENT_PATH: test/fixtures/smoke.json
          PAGER_INPUT: pager-input
        run: node pager/job.mjs prepare
      # A fix reads the logs of the failed jobs of the public repositories with the
      # token of the workflow, a token of this repository alone: the newest job of
      # the pager's own repository shows that GitHub still lets it.
      - name: Check that the token reads the job logs of a public repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository_owner }}/repo-pager
        run: |
          set -euo pipefail
          # A job that ran: a skipped one has no log.
          run=$(gh api "repos/$REPO/actions/runs?status=success&per_page=1" --jq '.workflow_runs[0].id')
          job=$(gh api "repos/$REPO/actions/runs/$run/jobs?per_page=100" --jq '[.jobs[] | select(.conclusion == "success")][0].id')
          # As prepare reads it: the API redirects to the log, and curl sends the
          # token to the API alone, not to the host of the redirect.
          status=$(curl --silent --location --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/jobs/$job/logs")
          if [ "$status" != 200 ]; then
            echo "::error::GitHub answered $status for the log of job $job of $REPO with the token of the workflow, so a fix reads no log: prepare needs a token that can."
            exit 1
          fi
          echo "The token reads the log of job $job of $REPO."
      # A draft of a discussion reads it through GraphQL with the same token, which
      # alone has discussions.
      - name: Check that the token reads the discussions of a public repository
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # The variables of GraphQL, which the shell leaves as they are.
          # shellcheck disable=SC2016
          query='query($owner: String!, $name: String!) { repository(owner: $owner, name: $name) { discussions { totalCount } } }'
          count=$(gh api graphql -f owner="$OWNER" -f name=repo-pager -f query="$query" \
            --jq '.data.repository.discussions.totalCount')
          if ! [[ "$count" =~ ^[0-9]+$ ]]; then
            echo "::error::The token of the workflow reads no discussions of $OWNER/repo-pager, so a draft of a discussion has no thread: prepare needs a token that can."
            exit 1
          fi
          echo "The token reads the $count discussion(s) of $OWNER/repo-pager."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pager-input
          path: pager-input/
          retention-days: 1
          if-no-files-found: error

  ask:
    name: Ask Claude
    needs: prepare
    permissions:
      contents: read
    # The path that actionlint knows; the syntax $/ is newer than actionlint.
    uses: ./.github/workflows/ask.yml # zizmor: ignore[self-repository]
    with:
      kind: text
      tools: ${{ needs.prepare.outputs.tools }}
      turns: ${{ needs.prepare.outputs.turns }}
      budget: ${{ needs.prepare.outputs.budget }}
      model: ${{ needs.prepare.outputs.model }}
      effort: ${{ needs.prepare.outputs.effort }}
      schema: ${{ needs.prepare.outputs.schema }}
      prompt: ${{ needs.prepare.outputs.prompt }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  check:
    name: Check the answer
    needs: ask
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check that Claude answered pong, in the schema
        env:
          PLAN: ${{ needs.ask.outputs.plan }}
        run: |
          set -euo pipefail
          echo "Claude answered: $PLAN"
          if ! jq -e '(.answer | ascii_downcase | contains("pong")) and (.proposal == null)' <<<"$PLAN" >/dev/null; then
            echo "::error::Claude's answer isn't pong in the schema of a free text."
            exit 1
          fi
