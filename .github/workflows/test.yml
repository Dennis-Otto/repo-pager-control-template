name: Tests

# The tests of the job scripts with every line, branch and function covered, the
# lint and format of the code, and the checks of the workflows: actionlint, and
# zizmor for the ways a workflow gets attacked. The tools run from images pinned by
# their digest, so that no action of a third party runs here: each image is the FROM
# of its Dockerfile in .github/tools/, which Dependabot keeps current, as it keeps
# Biome current in package.json. The diagrams are checked without Docker: no
# ```mermaid block in the Markdown, both pictures of every source that a page shows
# and a source for every picture. It doesn't see a picture that is older than its
# source, so draw the pictures anew after a change of one: bash scripts/diagrams.sh.

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests, lint and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Tests
        run: npm test
      - name: Check the diagrams
        if: ${{ !cancelled() }}
        run: npm run diagrams
      - name: Install Biome
        if: ${{ !cancelled() }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint and format
        if: ${{ !cancelled() }}
        run: npm run lint
      - name: Lint the workflows
        if: ${{ !cancelled() }}
        run: |
          image="$(awk '$1 == "FROM" { print $2; exit }' .github/tools/actionlint.Dockerfile)"
          docker run --rm --volume "$PWD:/repo" --workdir /repo "$image"
      - name: Audit the workflows
        if: ${{ !cancelled() }}
        run: |
          image="$(awk '$1 == "FROM" { print $2; exit }' .github/tools/zizmor.Dockerfile)"
          docker run --rm --volume "$PWD:/repo" --workdir /repo "$image" --offline --format github .github/workflows
