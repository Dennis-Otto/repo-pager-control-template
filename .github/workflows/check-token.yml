name: Check the Claude token

# Started by hand: proves that the secret CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`,
# the maintainer's subscription, valid for a year) still works. It asks Claude for two words and
# fails if they don't come back. Each run uses a tiny part of the weekly limit. Claude Code
# comes from .github/tools/claude-code/, whose package-lock.json pins it with its hash and
# which Dependabot keeps current. The workflow Check the set-up (setup.yml) calls it on
# the runner of the jobs of Claude, which proves that runner as well.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      runner:
        description: The runner to ask on, ubuntu-24.04 without it
        type: string
    secrets:
      # Not required, so that a missing token gets the error below.
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

permissions: {}

jobs:
  check:
    name: check the token
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install Claude Code
        run: npm ci --prefix .github/tools/claude-code --no-audit --no-fund
      - name: Ask Claude for two words
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # As in ask.yml: on the egress-firewall runner, only Anthropic is reached.
          DISABLE_TELEMETRY: "1"
          DISABLE_ERROR_REPORTING: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: |
          set -euo pipefail
          if [[ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]]; then
            echo "::error::The secret CLAUDE_CODE_OAUTH_TOKEN is missing."
            exit 1
          fi
          answer="$(.github/tools/claude-code/node_modules/.bin/claude -p 'Reply with exactly these two words and nothing else: token works' --max-turns 1)"
          echo "Claude answered: $answer"
          if [[ "${answer,,}" != *"token works"* ]]; then
            echo "::error::The token didn't get the expected answer."
            exit 1
          fi
