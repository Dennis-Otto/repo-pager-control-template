name: Ask Claude

# The one job that runs Claude, called by pager.yml for a job of the pager and by
# smoke.yml in a pull request. Claude Code runs with the maintainer's subscription, through
# CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`, never an API key, and each run
# counts against their weekly limit.
#
# What keeps it to its task:
# - GitHub's egress-firewall runner lets the machine reach only the hosts of
#   .github/egress-firewall.yaml: Anthropic, and what installs Claude Code.
# - --restricted and --tools leave Claude the tools that read files, and in a fix
#   those that write them, in the checkout alone: it runs no command and reaches no
#   network. A fix runs in the mode acceptEdits, in which its edits need no yes,
#   since nobody could give one; Claude Code still refuses a write of its settings,
#   of git and of the configuration of a tool. It gets the data that the job
#   prepare collected, and the repository of the job checked out without a token. A translation gets no tool at all, and
#   its notes in its prompt, between lines that no note can hold.
# - The job has the read-only token of the workflow and no secret that writes: the
#   jobs after it, on other machines, check Claude's answer and post it.
# - The data of the job comes in its inputs and the change of a fix goes back in its
#   outputs, packed as pager/pack.mjs says, never through the storage of the
#   artifacts, which this runner now and then doesn't reach: the inputs and the
#   outputs travel with the job itself. The pack reaches a step only through env:.

on:
  workflow_call:
    inputs:
      kind:
        description: The kind of the job, text, draft, fix or translate
        type: string
        required: true
      repo:
        description: The repository to check out for Claude, if any
        type: string
        default: ""
      tools:
        description: The tools of Claude, or none for no tool at all
        type: string
        default: ""
      mode:
        description: The permission mode of Claude Code, such as acceptEdits, or none for the default
        type: string
        default: ""
      turns:
        description: The most turns of Claude, or none for no limit
        type: string
        default: ""
      budget:
        description: The most that the run may take, in dollars of the API
        type: string
        required: true
      model:
        description: The model of Claude Code, such as claude-opus-5-5
        type: string
        required: true
      effort:
        description: The effort of Claude Code, low, medium, high, xhigh or max
        type: string
        required: true
      schema:
        description: The JSON schema of Claude's answer
        type: string
        required: true
      prompt:
        description: The prompt, which points Claude to data/task.md, or for a translation is its task
        type: string
        required: true
      pack1:
        description: Part 1 of the data of the job, packed by the job prepare as pager/pack.mjs says
        type: string
        default: ""
      pack2:
        description: Part 2 of the data of the job, packed by the job prepare as pager/pack.mjs says
        type: string
        default: ""
      pack3:
        description: Part 3 of the data of the job, packed by the job prepare as pager/pack.mjs says
        type: string
        default: ""
      pack4:
        description: Part 4 of the data of the job, packed by the job prepare as pager/pack.mjs says
        type: string
        default: ""
      pack_sha256:
        description: The sha256 of the pack of the data of the job, which the job checks before it unpacks it
        type: string
        required: true
      retry:
        description: Whether a second try follows when the data of the job or its checkout doesn't arrive
        type: boolean
        default: false
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
    outputs:
      plan:
        description: Claude's answer, the JSON of the schema
        value: ${{ jobs.ask.outputs.plan }}
      base:
        description: The commit of the repository that Claude saw
        value: ${{ jobs.ask.outputs.base }}
      changed:
        description: Whether a fix changed files
        value: ${{ jobs.ask.outputs.changed }}
      missing:
        description: Whether the data of the job or its checkout didn't arrive, so that Claude didn't run
        value: ${{ jobs.ask.outputs.missing }}
      patch1:
        description: Part 1 of the change of a fix, packed as pager/pack.mjs says
        value: ${{ jobs.ask.outputs.patch1 }}
      patch2:
        description: Part 2 of the change of a fix, packed as pager/pack.mjs says
        value: ${{ jobs.ask.outputs.patch2 }}
      patch3:
        description: Part 3 of the change of a fix, packed as pager/pack.mjs says
        value: ${{ jobs.ask.outputs.patch3 }}
      patch_sha256:
        description: The sha256 of the pack of the change, or none when it was too large to hand over
        value: ${{ jobs.ask.outputs.patch_sha256 }}
      patch_size:
        description: The characters of the pack of the change
        value: ${{ jobs.ask.outputs.patch_size }}

permissions: {}

jobs:
  ask:
    name: Ask Claude
    # GitHub's egress-firewall runner, a technical preview; PAGER_AI_RUNNER may name
    # another runner should GitHub rename or end it, which then reaches every host.
    runs-on: ${{ vars.PAGER_AI_RUNNER || 'ubuntu-24.04-firewall' }}
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      plan: ${{ steps.claude.outputs.structured_output }}
      base: ${{ steps.target.outputs.sha }}
      changed: ${{ steps.patch.outputs.changed }}
      missing: ${{ steps.data.outcome == 'failure' || steps.checkout.outcome == 'failure' }}
      patch1: ${{ steps.patch.outputs.patch1 }}
      patch2: ${{ steps.patch.outputs.patch2 }}
      patch3: ${{ steps.patch.outputs.patch3 }}
      patch_sha256: ${{ steps.patch.outputs.patch_sha256 }}
      patch_size: ${{ steps.patch.outputs.patch_size }}
    steps:
      # In a pull request, the smoke test, the Claude Code action restores its
      # settings files from the base branch with git, so it needs a checkout there.
      # A job of the pager has none: Claude's tools, which may write in a fix, find
      # no settings of git in the workspace that a later step would read.
      - name: Check out this repository for the Claude Code action
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: README.md
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # The data of the job and its checkout come before Claude, and may not come:
      # a pack that doesn't match its sha256, such as one with an output that GitHub
      # skipped, or a checkout that fails. Each step has a short limit of its own,
      # and with retry such a miss leaves the job green with the output missing, so
      # that the workflow Pager tries the job once more on a new machine; Claude
      # hasn't run, so nothing runs twice. Without retry, as in the smoke tests, or
      # on the second try, the miss fails the job. The pack comes through env:
      # alone, since it holds the text of strangers, and tar writes into data/ only.
      - name: Get the data of the job
        id: data
        continue-on-error: ${{ inputs.retry }}
        timeout-minutes: 1
        env:
          PACK1: ${{ inputs.pack1 }}
          PACK2: ${{ inputs.pack2 }}
          PACK3: ${{ inputs.pack3 }}
          PACK4: ${{ inputs.pack4 }}
          PACK_SHA256: ${{ inputs.pack_sha256 }}
        run: |
          set -euo pipefail
          pack="$RUNNER_TEMP/pager-input.tar.gz"
          printf '%s' "$PACK1$PACK2$PACK3$PACK4" | base64 --decode > "$pack"
          if ! printf '%s  %s\n' "$PACK_SHA256" "$pack" | sha256sum --check --status; then
            echo "::error::The data of the job didn't arrive whole: ${#PACK1}, ${#PACK2}, ${#PACK3} and ${#PACK4} characters, whose sha256 isn't that of the job prepare."
            exit 1
          fi
          mkdir data
          tar --extract --gzip --file "$pack" --directory data --no-same-owner --no-same-permissions --touch
      - name: Check out the repository of the job
        id: checkout
        if: steps.data.outcome == 'success' && inputs.repo != ''
        continue-on-error: ${{ inputs.retry }}
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repo }}
          path: repo
          persist-credentials: false
      - name: Say that the job is tried again
        if: steps.data.outcome == 'failure' || steps.checkout.outcome == 'failure'
        run: echo "::warning::The data of the job or its checkout didn't arrive, so Claude didn't run; the workflow Pager tries the job once more on a new machine."
      # Claude's tools may write in the checkout, and git runs on what is there after
      # it: the history of git and its settings go where the tools don't reach.
      - name: Keep the history of git out of Claude's reach
        id: target
        if: steps.checkout.outcome == 'success'
        run: |
          set -euo pipefail
          mv repo/.git "$RUNNER_TEMP/repo.git"
          echo "sha=$(git --git-dir="$RUNNER_TEMP/repo.git" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Ask Claude
        id: claude
        if: steps.data.outcome == 'success' && (inputs.repo == '' || steps.target.outcome == 'success')
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        env:
          DISABLE_TELEMETRY: "1"
          DISABLE_ERROR_REPORTING: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The read-only token of the job, so that no app of Anthropic is needed.
          github_token: ${{ github.token }}
          # The pager's GitHub App sends the events: the app of the maintainer's
          # own instance, whose name on GitHub, its slug, the variable PAGER_APP
          # holds. Without it, the action refuses the events of the app.
          allowed_bots: ${{ vars.PAGER_APP }}
          # PROMPT of pager/core.mjs, or the task of a translation with its notes.
          prompt: ${{ inputs.prompt }}
          # The rules come first, as the system prompt; nothing ever prompts, and
          # the run stops at its budget and at its turns, where it has any: the
          # action fails a run whose result counts more turns than --max-turns,
          # before it reads the answer, so a fix has none. The model, the effort,
          # the budget and the turns are those of the kind of job, in LIMITS of
          # pager/core.mjs, which the job prepare hands on with PAGER_MODEL and
          # PAGER_LIMITS laid over them, each checked. --tools takes its value after an
          # equals sign: the action reads an empty value after a space as a flag
          # without one, and Claude Code would take the next flag for its tools.
          # The mode of a fix, acceptEdits, lets Edit and Write change the files of
          # the checkout: in the default mode each edit waits for a yes, which
          # --permission-prompts none refuses.
          claude_args: |
            --restricted
            --tools="${{ inputs.tools }}"
            --permission-prompts none
            ${{ inputs.mode != '' && format('--permission-mode {0}', inputs.mode) || '' }}
            --append-system-prompt-file data/rules.md
            ${{ inputs.turns != '' && format('--max-turns {0}', inputs.turns) || '' }}
            --max-budget-usd ${{ inputs.budget }}
            --model ${{ inputs.model }}
            --effort ${{ inputs.effort }}
            --json-schema '${{ inputs.schema }}'
      # The transcript of the run, for the answer job, which counts what it took,
      # and for the maintainer, who may look at what Claude read and did.
      # It goes to the storage of the artifacts, so its upload can't fail the job:
      # without it, the answer has no usage, and Claude's answer still goes.
      - name: Keep the transcript
        if: always() && steps.claude.outputs.execution_file != ''
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pager-transcript
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 3
      # git runs with the history from before, without hooks or a monitor of the
      # file system, so that nothing that Claude wrote runs. The change goes back in
      # the outputs, a patch in gzip in base64, in chunks of 100,000 characters, as
      # PACK of pager/pack.mjs says; one of more than three chunks goes without its
      # sha256, and the job pull-request answers that it is too large to hand over.
      - name: Collect the change of the fix
        id: patch
        if: inputs.kind == 'fix' && steps.claude.outcome == 'success'
        run: |
          set -euo pipefail
          git() {
            command git --git-dir="$RUNNER_TEMP/repo.git" --work-tree=repo \
              -c core.hooksPath=/dev/null -c core.fsmonitor=false "$@"
          }
          git add --all
          git diff --cached --binary > "$RUNNER_TEMP/fix.patch"
          if [ ! -s "$RUNNER_TEMP/fix.patch" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          gzip -9 -n -c "$RUNNER_TEMP/fix.patch" > "$RUNNER_TEMP/fix.patch.gz"
          packed=$(base64 -w 0 "$RUNNER_TEMP/fix.patch.gz")
          chunk=100000
          chunks=3
          echo "patch_size=${#packed}" >> "$GITHUB_OUTPUT"
          if [ "${#packed}" -gt $((chunk * chunks)) ]; then
            echo "::warning::The change of the fix is too large to hand over: ${#packed} characters packed."
            exit 0
          fi
          for index in $(seq 1 "$chunks"); do
            echo "patch$index=${packed:$(((index - 1) * chunk)):$chunk}" >> "$GITHUB_OUTPUT"
          done
          echo "patch_sha256=$(sha256sum "$RUNNER_TEMP/fix.patch.gz" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
