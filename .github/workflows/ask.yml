name: Ask Claude

# The one job that runs Claude, called by pager.yml for a job of the pager and by
# smoke.yml in a pull request. Claude Code runs with the maintainer's subscription, through
# CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`, never an API key, and each run
# counts against their weekly limit.
#
# What keeps it to its task:
# - GitHub's egress-firewall runner lets the machine reach only the hosts of
#   .github/egress-firewall.yaml: Anthropic, and what installs Claude Code.
# - --restricted and --tools leave Claude the tools that read files, and in a fix
#   those that write them, in the checkout alone: it runs no command and reaches no
#   network. A fix runs in the mode acceptEdits, in which its edits need no yes,
#   since nobody could give one; Claude Code still refuses a write of its settings,
#   of git and of the configuration of a tool. It gets the data that the job
#   prepare collected, and the repository of the job checked out without a token. A translation gets no tool at all, and
#   its notes in its prompt, between lines that no note can hold.
# - The job has the read-only token of the workflow and no secret that writes: the
#   jobs after it, on other machines, check Claude's answer and post it.

on:
  workflow_call:
    inputs:
      kind:
        description: The kind of the job, text, draft, fix or translate
        type: string
        required: true
      repo:
        description: The repository to check out for Claude, if any
        type: string
        default: ""
      tools:
        description: The tools of Claude, or none for no tool at all
        type: string
        default: ""
      mode:
        description: The permission mode of Claude Code, such as acceptEdits, or none for the default
        type: string
        default: ""
      turns:
        description: The most turns of Claude, or none for no limit
        type: string
        default: ""
      budget:
        description: The most that the run may take, in dollars of the API
        type: string
        required: true
      model:
        description: The model of Claude Code, such as claude-opus-5-5
        type: string
        required: true
      effort:
        description: The effort of Claude Code, low, medium, high, xhigh or max
        type: string
        required: true
      schema:
        description: The JSON schema of Claude's answer
        type: string
        required: true
      prompt:
        description: The prompt, which points Claude to data/task.md, or for a translation is its task
        type: string
        required: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
    outputs:
      plan:
        description: Claude's answer, the JSON of the schema
        value: ${{ jobs.ask.outputs.plan }}
      base:
        description: The commit of the repository that Claude saw
        value: ${{ jobs.ask.outputs.base }}
      changed:
        description: Whether a fix changed files
        value: ${{ jobs.ask.outputs.changed }}

permissions: {}

jobs:
  ask:
    name: Ask Claude
    # GitHub's egress-firewall runner, a technical preview; PAGER_AI_RUNNER may name
    # another runner should GitHub rename or end it, which then reaches every host.
    runs-on: ${{ vars.PAGER_AI_RUNNER || 'ubuntu-24.04-firewall' }}
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      plan: ${{ steps.claude.outputs.structured_output }}
      base: ${{ steps.target.outputs.sha }}
      changed: ${{ steps.patch.outputs.changed }}
    steps:
      # In a pull request, the smoke test, the Claude Code action restores its
      # settings files from the base branch with git, so it needs a checkout there.
      # A job of the pager has none: Claude's tools, which may write in a fix, find
      # no settings of git in the workspace that a later step would read.
      - name: Check out this repository for the Claude Code action
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: README.md
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Get the data of the job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pager-input
          path: data
      - name: Check out the repository of the job
        if: inputs.repo != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repo }}
          path: repo
          persist-credentials: false
      # Claude's tools may write in the checkout, and git runs on what is there after
      # it: the history of git and its settings go where the tools don't reach.
      - name: Keep the history of git out of Claude's reach
        id: target
        if: inputs.repo != ''
        run: |
          set -euo pipefail
          mv repo/.git "$RUNNER_TEMP/repo.git"
          echo "sha=$(git --git-dir="$RUNNER_TEMP/repo.git" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Ask Claude
        id: claude
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1.0.266
        env:
          DISABLE_TELEMETRY: "1"
          DISABLE_ERROR_REPORTING: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The read-only token of the job, so that no app of Anthropic is needed.
          github_token: ${{ github.token }}
          # The pager's GitHub App sends the events: the app of the maintainer's
          # own instance, whose name on GitHub, its slug, the variable PAGER_APP
          # holds. Without it, the action refuses the events of the app.
          allowed_bots: ${{ vars.PAGER_APP }}
          # PROMPT of pager/core.mjs, or the task of a translation with its notes.
          prompt: ${{ inputs.prompt }}
          # The rules come first, as the system prompt; nothing ever prompts, and
          # the run stops at its budget and at its turns, where it has any: the
          # action fails a run whose result counts more turns than --max-turns,
          # before it reads the answer, so a fix has none. The model and the effort
          # are those of the kind of job, in LIMITS of pager/core.mjs; PAGER_MODEL
          # may name another model for every kind. --tools takes its value after an
          # equals sign: the action reads an empty value after a space as a flag
          # without one, and Claude Code would take the next flag for its tools.
          # The mode of a fix, acceptEdits, lets Edit and Write change the files of
          # the checkout: in the default mode each edit waits for a yes, which
          # --permission-prompts none refuses.
          claude_args: |
            --restricted
            --tools="${{ inputs.tools }}"
            --permission-prompts none
            ${{ inputs.mode != '' && format('--permission-mode {0}', inputs.mode) || '' }}
            --append-system-prompt-file data/rules.md
            ${{ inputs.turns != '' && format('--max-turns {0}', inputs.turns) || '' }}
            --max-budget-usd ${{ inputs.budget }}
            --model ${{ vars.PAGER_MODEL || inputs.model }}
            --effort ${{ inputs.effort }}
            --json-schema '${{ inputs.schema }}'
      # The transcript of the run, for the answer job, which counts what it took,
      # and for the maintainer, who may look at what Claude read and did.
      - name: Keep the transcript
        if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pager-transcript
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 3
      # git runs with the history from before, without hooks or a monitor of the
      # file system, so that nothing that Claude wrote runs.
      - name: Collect the change of the fix
        id: patch
        if: inputs.kind == 'fix' && steps.claude.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fix"
          git() {
            command git --git-dir="$RUNNER_TEMP/repo.git" --work-tree=repo \
              -c core.hooksPath=/dev/null -c core.fsmonitor=false "$@"
          }
          git add --all
          git diff --cached --binary > "$RUNNER_TEMP/fix/fix.patch"
          if [ -s "$RUNNER_TEMP/fix/fix.patch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Hand over the change
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pager-fix
          path: ${{ runner.temp }}/fix/fix.patch
          retention-days: 3
